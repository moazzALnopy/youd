<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF6A00;
    --orange-dark:#E65A00;
    --orange-tint:#FFF1E6;
    --ink:#181818;
    --grey:#6B7280;
    --grey-light:#9CA3AF;
    --bg:#F7F7F8;
    --card:#FFFFFF;
    --line:#EEEEEE;
    --green:#16A34A;
    --radius:16px;
    --shadow: 0 10px 24px -12px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{
    max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px;
    background-image:
      linear-gradient(rgba(247,247,248,0.93), rgba(247,247,248,0.93)),
      url('https://i.ibb.co/jkF3R4WX/youd.png');
    background-size:cover;
    background-position:top center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }

  h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;}

  .topbar{background:var(--orange);color:#fff;padding:18px 18px 24px;border-radius:0 0 22px 22px;display:flex;flex-direction:column;align-items:center;}
  .topbar .logo-wrap{background:#fff;border-radius:14px;padding:8px 18px;box-shadow:0 6px 16px -6px rgba(0,0,0,0.2);}
  .topbar .logo{height:32px;width:auto;object-fit:contain;display:block;}
  .topbar .loc{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;background:rgba(255,255,255,0.18);width:fit-content;padding:6px 12px;border-radius:100px;}

  .back-topbar{background:var(--orange);color:#fff;padding:18px;display:flex;align-items:center;gap:12px;border-radius:0 0 18px 18px;}
  .back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .back-topbar h2{font-size:17px;font-weight:700;}
  .back-topbar .sub{font-size:11.5px;opacity:.85;margin-top:2px;}

  .section{padding:18px;}
  .section-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--ink);}
  .cat-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--orange-dark);margin:18px 0 10px;}
  .cat-title:first-child{margin-top:0;}

  .vendor-list{display:flex;flex-direction:column;gap:14px;}
  .vendor-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
    border:1px solid var(--line);transition:transform .15s ease;
  }
  .vendor-card:active{transform:scale(0.98);}
  .vendor-img{height:110px;background:linear-gradient(135deg,var(--accent,var(--orange)),#ffb27a);position:relative;display:flex;align-items:flex-end;padding:10px;}
  .vendor-badge{background:#fff;color:var(--ink);font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:100px;}
  .vendor-body{padding:12px 14px 14px;}
  .vendor-body h3{font-size:15.5px;font-weight:700;}
  .vendor-body .tag{font-size:12px;color:var(--grey);margin-top:2px;}
  .vendor-meta{display:flex;gap:12px;margin-top:8px;font-size:11.5px;color:var(--grey);}
  .vendor-meta span{display:flex;align-items:center;gap:4px;}
  .rating{color:var(--green);font-weight:700;}

  .menu-list{display:flex;flex-direction:column;gap:10px;}
  .item-card{background:var(--card);border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);}
  .item-info h4{font-size:14.5px;font-weight:600;margin-bottom:3px;}
  .item-info p{font-size:11.5px;color:var(--grey);margin:0 0 8px;line-height:1.4;}
  .item-price{font-size:13.5px;font-weight:700;color:var(--ink);}
  .item-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;}
  .qty-row{display:flex;align-items:center;gap:10px;background:var(--orange-tint);border-radius:10px;padding:5px;}
  .qty-btn{width:24px;height:24px;border-radius:6px;border:none;background:var(--orange);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .qty-val{min-width:14px;text-align:center;font-size:13px;font-weight:700;}
  .add-btn{padding:7px 16px;border-radius:9px;border:1.5px solid var(--orange);background:#fff;color:var(--orange);font-weight:700;font-size:12px;cursor:pointer;}

  .item-card.sized{flex-direction:column;align-items:stretch;}
  .size-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .size-row{display:flex;justify-content:space-between;align-items:center;background:var(--orange-tint);border-radius:10px;padding:8px 10px;}
  .size-row .size-label{font-size:12.5px;font-weight:700;color:var(--ink);}
  .size-row .size-price{font-size:11.5px;color:var(--grey);margin-left:8px;font-weight:500;}

  .cartbar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;padding:12px 16px;z-index:30;}
  .cartbar-inner{
    background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;display:flex;align-items:center;
    justify-content:space-between;box-shadow:0 12px 28px -10px rgba(0,0,0,0.4);cursor:pointer;

  .cart-left{display:flex;align-items:center;gap:10px;}
  .cart-count{background:var(--orange);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;}
  .cart-left b{font-size:13.5px;}
  .cart-left .places{font-size:10.5px;opacity:.7;display:block;margin-top:1px;}
  .cart-right{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;}

  .place-group{margin-bottom:16px;}
  .place-group h4{font-size:13px;font-weight:800;color:var(--orange-dark);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .summary-card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:4px 14px;}
  .summary-row{display:flex;justify-content:space-between;padding:12px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .name{color:var(--ink);}
  .summary-row .qty{color:var(--grey-light);font-weight:600;margin-right:6px;}
  .summary-row .price{font-weight:700;}
  .place-subtotal{text-align:right;font-size:12px;color:var(--grey);margin-top:6px;padding-right:2px;}

  .review-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
  .review-row:last-child{border-bottom:none;}
  .review-row .review-name{font-size:13.5px;font-weight:600;color:var(--ink);}
  .review-row .review-price{font-size:11.5px;color:var(--grey);margin-top:2px;}

  .totals{margin-top:14px;background:var(--card);border-radius:14px;border:1px solid var(--line);padding:14px;}
  .totals .row{display:flex;justify-content:space-between;font-size:13px;color:var(--grey);padding:4px 0;}
  .totals .row.total{color:var(--ink);font-weight:800;font-size:15.5px;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line);}

  .field-group{margin-top:16px;}
  .field-group label{font-size:12px;font-weight:700;color:var(--grey);display:block;margin-bottom:6px;}
  .field-group input, .field-group textarea, .field-group select{
    width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);

  .area-pill{display:inline-flex;align-items:center;gap:6px;background:var(--orange-tint);color:var(--orange-dark);font-weight:700;font-size:13px;padding:10px 14px;border-radius:11px;}

  .place-btn{width:100%;background:var(--orange);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(255,106,0,0.5);display:flex;align-items:center;justify-content:center;gap:8px;}
  .place-btn:disabled{opacity:.6;}
  .place-btn.loading .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .success-wrap{padding:70px 26px;text-align:center;}
  .success-icon{width:80px;height:80px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:36px;color:#fff;}

  .success-wrap p{font-size:13.5px;color:var(--grey);line-height:1.6;margin-bottom:26px;}
  .order-id{font-family:'Inter',monospace;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--grey);margin-bottom:26px;}
  .home-btn{background:var(--ink);color:#fff;border:none;padding:14px 26px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .system-credit{margin-top:36px;font-size:11px;color:var(--grey-light);}

</head>

];

// Shown as a small footer line on the final "Order placed" screen.

const SYSTEM_CREDIT = 'This system made by <a href="https://instagram.com/longlivealnopy" target="_blank" rel="noopener">moazz alnopy</a> ❤️';


let screen = "home";
let activeId = null;
let lastOrderSummary = null;

let customer = { name: "", phone: "" };
let notesByRestaurant = {};
RESTAURANTS.forEach(r => notesByRestaurant[r.id] = "");

const urlParams = new URLSearchParams(window.location.search);
const urlArea = urlParams.get('area');
const areaLocked = !!urlArea && AREAS.some(a => a.code === urlArea);
let selectedArea = areaLocked ? urlArea : "";

const appEl = document.getElementById('app');
const fmt = n => n.toLocaleString('en-US');
const areaLabel = code => (AREAS.find(a => a.code === code) || {}).label || code;

function currentRestaurant(){ return RESTAURANTS.find(r => r.id === activeId); }
function findCategory(r, catName){ return r.categories.find(c => c.name === catName); }
function findMenuItem(r, catName, itemName){
  const cat = findCategory(r, catName);
  return cat ? cat.items.find(i => i.name === itemName) : null;
}
function cartKey(catName, itemName, sizeLabel){ return `${catName}::${itemName}::${sizeLabel || ''}`; }
function parseCartKey(key){
  const [catName, itemName, sizeLabel] = key.split('::');
  return { catName, itemName, sizeLabel: sizeLabel || null };
}
function lineInfo(r, key){
  const { catName, itemName, sizeLabel } = parseCartKey(key);
  const item = findMenuItem(r, catName, itemName);
  const price = sizeLabel ? item.sizes.find(s => s.label === sizeLabel).price : item.price;
  const displayName = sizeLabel ? `${itemName} (${sizeLabel})` : itemName;
  return { catName, itemName, sizeLabel, price, displayName };
}
function cartEntries(rid){ return Object.entries(carts[rid] || {}); }
function cartCount(rid){ return cartEntries(rid).reduce((s,[,q]) => s+q, 0); }
function cartTotal(rid){
  const r = RESTAURANTS.find(x=>x.id===rid);
  return cartEntries(rid).reduce((s,[key,q]) => s + lineInfo(r,key).price*q, 0);
}
function filledRestaurants(){ return RESTAURANTS.filter(r => cartCount(r.id) > 0); }
function totalCartCount(){ return RESTAURANTS.reduce((s,r) => s + cartCount(r.id), 0); }
function totalCartValue(){ return RESTAURANTS.reduce((s,r) => s + cartTotal(r.id), 0); }

  const cart = carts[rid];
  const next = (cart[itemName] || 0) + delta;
  if(next <= 0){ delete cart[itemName]; } else { cart[itemName] = next; }
  render();
}

function render(){
  if(screen === "home") appEl.innerHTML = renderHome();
  else if(screen === "menu") appEl.innerHTML = renderMenu();
  else if(screen === "review") appEl.innerHTML = renderReview();
  else if(screen === "confirm") appEl.innerHTML = renderConfirm();
  else if(screen === "success") appEl.innerHTML = renderSuccess();
  bindEvents();
}

function renderGlobalCartBar(){
  const count = totalCartCount();
  if(count === 0) return "";
  const places = filledRestaurants().map(r => r.name).join(", ");
  return `
    <div class="cartbar">
      <div class="cartbar-inner" data-go-review>
        <div class="cart-left">
          <div class="cart-count">${count}</div>
          <div>
            <b>View order</b>
            <span class="places">${places}</span>
          </div>
        </div>
        <div class="cart-right">${fmt(totalCartValue())} EGP →</div>
      </div>
    </div>
  `;
}

function renderHome(){
  return `
    <div class="topbar">
      <div class="logo-wrap">
        <img class="logo" src="https://i.ibb.co/jkF3R4WX/youd.png" alt="Logo">
      </div>
      ${areaLocked ? `<div class="loc">📍 ${areaLabel(selectedArea)}</div>` : ''}
    </div>
    <div class="section">
      <div class="section-title">Places at Plato</div>
      <div class="vendor-list">
        ${RESTAURANTS.map(r => `
          <div class="vendor-card" data-open="${r.id}">
            <div class="vendor-img" style="--accent:${r.accent}">
              <span class="vendor-badge">${r.meta}</span>
            </div>
            <div class="vendor-body">
              <h3>${r.name}</h3>
              <div class="tag">${r.tag}</div>
              <div class="vendor-meta">
                <span class="rating">★ 4.${5 + (r.name.length % 4)}</span>
                <span>·</span>
                <span>${cartCount(r.id) > 0 ? cartCount(r.id) + ' in your order' : 'Tap to view menu'}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    ${renderGlobalCartBar()}
  `;
}

function renderMenu(){
  const r = currentRestaurant();
  return `
    <div class="back-topbar">
      <button class="back-btn" data-back-home>←</button>
      <div>
        <h2>${r.name}</h2>
        <div class="sub">${r.tag}</div>
      </div>
    </div>
    <div class="section">
      ${r.categories.map(cat => `
        <div class="cat-title">${cat.name}</div>
        <div class="menu-list">
          ${cat.items.map(item => renderItemCard(r, cat.name, item)).join('')}
        </div>
      `).join('')}
    </div>
    ${renderGlobalCartBar()}
  `;
}

function renderItemCard(r, catName, item){
  if(item.sizes){
    return `
      <div class="item-card sized">
        <div class="item-info">
          <h4>${item.name}</h4>
        </div>
        <div class="size-list">
          ${item.sizes.map(size => {
            const key = cartKey(catName, item.name, size.label);
            const qty = carts[r.id][key] || 0;
            return `
              <div class="size-row">
                <div>
                  <span class="size-label">${size.label}</span>
                  <span class="size-price">${fmt(size.price)} EGP</span>
                </div>
                ${qty > 0 ? `
                  <div class="qty-row">
                    <button class="qty-btn" data-minus data-rid="${r.id}" data-item="${key}">–</button>
                    <span class="qty-val">${qty}</span>
                    <button class="qty-btn" data-add data-rid="${r.id}" data-item="${key}">+</button>
                  </div>
                ` : `<button class="add-btn" data-add data-rid="${r.id}" data-item="${key}">Add</button>`}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  const key = cartKey(catName, item.name, null);
  const qty = carts[r.id][key] || 0;
  return `
    <div class="item-card">
      <div class="item-info">
        <h4>${item.name}</h4>
        <div class="item-price">${fmt(item.price)} EGP</div>
      </div>
      <div class="item-right">
        ${qty > 0 ? `
          <div class="qty-row">
            <button class="qty-btn" data-minus data-rid="${r.id}" data-item="${key}">–</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-add data-rid="${r.id}" data-item="${key}">+</button>
          </div>
        ` : `<button class="add-btn" data-add data-rid="${r.id}" data-item="${key}">Add</button>`}
      </div>
    </div>
  `;
}

function renderReview(){
  const groups = filledRestaurants();
  const total = totalCartValue();

  if(groups.length === 0){
    return `
      <div class="back-topbar">
        <button class="back-btn" data-back-home>←</button>
        <div><h2>Your order</h2></div>
      </div>
      <div class="section">
        <p style="color:var(--grey);font-size:13.5px;text-align:center;padding:40px 0;">Your order is empty. Go back and add some items.</p>
      </div>
    `;
  }

  return `
    <div class="back-topbar">
      <button class="back-btn" data-back-home>←</button>
      <div>
        <h2>Review order</h2>
        <div class="sub">${groups.map(r=>r.name).join(' · ')}</div>
      </div>
    </div>
    <div class="section">
      ${groups.map(r => `
        <div class="place-group">
          <h4>🍽️ ${r.name}</h4>
          <div class="summary-card">
            ${cartEntries(r.id).map(([key, qty]) => {
              const { displayName, price } = lineInfo(r, key);
              return `
                <div class="review-row">
                  <div>
                    <div class="review-name">${displayName}</div>
                    <div class="review-price">${fmt(price)} EGP each · ${fmt(price*qty)} EGP</div>
                  </div>
                  <div class="qty-row">
                    <button class="qty-btn" data-minus data-rid="${r.id}" data-item="${key}">–</button>
                    <span class="qty-val">${qty}</span>
                    <button class="qty-btn" data-add data-rid="${r.id}" data-item="${key}">+</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="place-subtotal">Subtotal: ${fmt(cartTotal(r.id))} EGP</div>
        </div>
      `).join('')}

      <div class="totals">
        <div class="row total"><span>Total</span><span>${fmt(total)} EGP</span></div>
      </div>
    </div>

    <div style="height:110px;"></div>
    <div class="place-order-bar">
      <button class="place-btn" id="continue-btn">
        <span class="btn-label">Continue · ${fmt(total)} EGP</span>
      </button>
    </div>
  `;
}

function renderConfirm(){
  const groups = filledRestaurants();
  const multi = groups.length > 1;
  const total = totalCartValue();

  return `
    <div class="back-topbar">
      <button class="back-btn" data-back-review>←</button>
      <div>
        <h2>Confirm order</h2>
        <div class="sub">${groups.map(r=>r.name).join(' · ')}</div>
      </div>
    </div>
    <div class="section">
      ${groups.map(r => `
        <div class="place-group">
          <h4>🍽️ ${r.name}</h4>
          <div class="summary-card">
            ${cartEntries(r.id).map(([key, qty]) => {
              const { displayName, price } = lineInfo(r, key);
              return `<div class="summary-row">
                <span class="name"><span class="qty">${qty}×</span>${displayName}</span>
                <span class="price">${fmt(price*qty)} EGP</span>
              </div>`;
            }).join('')}
          </div>
          <div class="place-subtotal">Subtotal: ${fmt(cartTotal(r.id))} EGP</div>
        </div>
      `).join('')}

      <div class="totals">
        <div class="row total"><span>Total</span><span>${fmt(total)} EGP</span></div>
      </div>

      <div class="section-title" style="margin-top:22px;">Your details</div>
      <div class="field-group">
        <label>Name</label>
        <input type="text" id="f-name" placeholder="e.g. Sara Ahmed" value="${customer.name}">
      </div>
      <div class="field-group">
        <label>Phone number (optional)</label>
        <input type="tel" id="f-phone" placeholder="e.g. 01012345678" value="${customer.phone}">
      </div>
      <div class="field-group">
        <label>Your area</label>
        ${areaLocked ? `
          <div class="area-pill">📍 ${areaLabel(selectedArea)}</div>
        ` : `
          <select id="f-area">
            <option value="" ${selectedArea===''?'selected':''}>Select your area…</option>
            ${AREAS.map(a => `<option value="${a.code}" ${selectedArea===a.code?'selected':''}>${a.label}</option>`).join('')}
          </select>
        `}
      </div>

      <div class="section-title" style="margin-top:22px;">Notes</div>
      ${multi ? groups.map(r => `
        <div class="field-group">
          <label>Notes for ${r.name} (optional)</label>
          <textarea data-note-for="${r.id}" rows="2" placeholder="Any special requests for ${r.name}">${notesByRestaurant[r.id]}</textarea>
        </div>
      `).join('') : `
        <div class="field-group">
          <label>Notes (optional)</label>
          <textarea data-note-for="${groups[0]?.id}" rows="2" placeholder="Any special requests">${notesByRestaurant[groups[0]?.id]}</textarea>
        </div>
      `}
    </div>

    <div style="height:110px;"></div>
    <div class="place-order-bar">
      <button class="place-btn" id="place-order-btn">
        <span class="btn-label">Place order · ${fmt(total)} EGP</span>
      </button>
    </div>
  `;
}

function renderSuccess(){
  return `
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <h2>Order placed!</h2>
      <p>${lastOrderSummary.restaurants.join(', ')} ${lastOrderSummary.restaurants.length > 1 ? 'have' : 'has'} received your order and will start preparing it shortly.</p>
      <div class="order-id">Order reference: ${lastOrderSummary.code}</div>
      <button class="home-btn" data-back-home>Back to home</button>
      <div class="system-credit">${SYSTEM_CREDIT}</div>
    </div>
  `;
}

function bindEvents(){
  appEl.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeId = el.dataset.open; screen = "menu"; render(); });
  });
  appEl.querySelectorAll('[data-back-home]').forEach(el=>{
    el.addEventListener('click', ()=>{ screen = "home"; render(); });
  });
  appEl.querySelectorAll('[data-back-review]').forEach(el=>{
    el.addEventListener('click', ()=>{ screen = "review"; render(); });
  });
  appEl.querySelectorAll('[data-go-review]').forEach(el=>{
    el.addEventListener('click', ()=>{ screen = "review"; render(); });
  });
  appEl.querySelectorAll('[data-add]').forEach(el=>{
    el.addEventListener('click', ()=> changeQty(el.dataset.rid, el.dataset.item, 1));
  });
  appEl.querySelectorAll('[data-minus]').forEach(el=>{
    el.addEventListener('click', ()=> changeQty(el.dataset.rid, el.dataset.item, -1));
  });

  const continueBtn = document.getElementById('continue-btn');
  if(continueBtn) continueBtn.addEventListener('click', ()=>{ screen = "confirm"; render(); });

  const placeBtn = document.getElementById('place-order-btn');
  if(placeBtn) placeBtn.addEventListener('click', placeOrder);

  ['f-name','f-phone'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ customer[id.replace('f-','')] = el.value; });
  });

  const areaSelect = document.getElementById('f-area');
  if(areaSelect) areaSelect.addEventListener('change', ()=>{ selectedArea = areaSelect.value; });

  appEl.querySelectorAll('[data-note-for]').forEach(el=>{
    el.addEventListener('input', ()=>{ notesByRestaurant[el.dataset.noteFor] = el.value; });
  });
}

async function placeOrder(){
  if(placing) return;
  const groups = filledRestaurants();
  if(groups.length === 0) return;

  if(!customer.name.trim()){
    alert("Please add your name before placing the order.");
    return;
  }
  if(!selectedArea){
    alert("Please select your area.");
    return;
  }

  placing = true;
  const btn = document.getElementById('place-order-btn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.innerHTML = `<span class="spinner"></span> Placing order…`;

  const mainCode = "ORD-" + Date.now().toString().slice(-6);
  const timestamp = new Date().toISOString();

  const sends = groups.map(async (r) => {
    const items = cartEntries(r.id).map(([key, qty]) => {
      const { itemName, sizeLabel, price } = lineInfo(r, key);
      return { name: itemName, size: sizeLabel || "", qty, price, lineTotal: price*qty };
    });
    const payload = {
      orderId: `${mainCode}-${r.id}`,
      restaurant: r.name,
      area: areaLabel(selectedArea),
      items,
      total: cartTotal(r.id),
      customerName: customer.name,
      customerPhone: customer.phone,
      notes: notesByRestaurant[r.id] || "",
      timestamp
    };
    if(r.sheetUrl && r.sheetUrl.startsWith("http")){
      try{
        await fetch(r.sheetUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
      } catch(err){
        console.error(`Failed to send order to Google Sheets for ${r.name}:`, err);
      }
    } else {
      console.warn(`No sheetUrl set for ${r.name} — order was not sent anywhere. Payload:`, payload);
    }
  });

  await Promise.allSettled(sends);

  lastOrderSummary = { code: mainCode, restaurants: groups.map(r => r.name) };
  groups.forEach(r => { carts[r.id] = {}; notesByRestaurant[r.id] = ""; });
  customer = { name: "", phone: "" };
  placing = false;
  screen = "success";
  render();
}

render();
</script>
